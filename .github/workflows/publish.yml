name: Pages Workflow
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A06A54: ${{ secrets.A06A54 }}
          B26F5D: ${{ secrets.B26F5D }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A06A54', '')
          env_b = os.environ.get('B26F5D', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 4ee3731eb191cf03d495b5adc7143f4d31 -->', env_a)
          if env_b:
              result = result.replace('<!-- d02125fa349b298d0c8dc232e55c85da -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
